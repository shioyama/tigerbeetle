containers:
  default:
    environment: ci
    privileged: true
    build:
      from: ubuntu-24
      type: ci
      apt:
        repos:
          - "deb https://pkgs.shopify.io/STATIC_CLOUDSMITH_TOKEN/public/deb/ubuntu noble main"
        keys:
          - "https://pkgs.shopify.io/STATIC_CLOUDSMITH_TOKEN/public/gpg.key"
        install:
          - git
          - curl
          - xz-utils
          - golang-go

steps:
  - label: ':arrow_down: Download Zig'
    timeout: 5m
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
    run:
      - sh .shopify-build/install-zig.sh

  - label: ':arrow_down: Fetch fork binaries'
    timeout: 5m
    cache:
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
    run:
      - sh .shopify-build/fetch-fork-binaries.sh

  - wait

  - label: ':package: Build and publish'
    timeout: 30m
    branches: "0.*-shopify*"
    git:
      history: full
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
        upload: false
    run:
      - sh .shopify-build/fetch-upstream-tags.sh
      - ./.zig-install/zig build scripts -- release --build --shopify --sha="$BUILDKITE_COMMIT"
    publish:
      package:
        repository_name: 'public'
        package_type: 'deb'
        distro_version: 'ubuntu/noble'
        fail_on_duplicate: false
        artifacts:
          - path: zig-out/shopify-dist
            patterns: ['*.deb']
