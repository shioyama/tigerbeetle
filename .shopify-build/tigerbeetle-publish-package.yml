containers:
  default:
    environment: ci
    privileged: true
    build:
      from: ubuntu-24
      type: ci
      apt:
        install:
          - git
          - curl
          - xz-utils
          - golang-go

steps:
  - label: ':arrow_down: Download Zig'
    timeout: 5m
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
    run:
      - sh .shopify-build/install-zig.sh

  - label: ':memo: No unreleased patches'
    timeout: 1m
    run:
      - bash .shopify-build/scripts/check-release-ready.sh

  - wait

  - label: ':package: Build and publish release'
    timeout: 30m
    branches: "0.*-shopify*"
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
    run:
      - git init && git config user.email ci@shopify.com && git config user.name CI && git add -A && git commit -m ci
      - ./.zig-install/zig build -Dgit-commit="$BUILDKITE_COMMIT" scripts -- release --build --sha="$BUILDKITE_COMMIT" --timestamp="$(date +%s)"
      - (cd tb-snapshot && ../.zig-install/zig build -Dtarget=x86_64-linux -Dconfig-release="${BUILDKITE_BRANCH%%-shopify*}" -Dconfig-release-client-min=0.16.4)
      - |
        VERSION=$BUILDKITE_BRANCH
        PKG=tigerbeetle_${VERSION}_amd64
        mkdir -p deb-pkg/${PKG}/DEBIAN deb-pkg/${PKG}/usr/bin
        unzip zig-out/dist/tigerbeetle/tigerbeetle-x86_64-linux.zip -d deb-pkg/${PKG}/usr/bin/
        chmod 755 deb-pkg/${PKG}/usr/bin/tigerbeetle
        cp tb-snapshot/zig-out/bin/tb-snapshot deb-pkg/${PKG}/usr/bin/
        chmod 755 deb-pkg/${PKG}/usr/bin/tb-snapshot
        cat > deb-pkg/${PKG}/DEBIAN/control <<CTRL
        Package: tigerbeetle
        Version: ${VERSION}
        Architecture: amd64
        Maintainer: Shopify <infrastructure@shopify.com>
        Description: TigerBeetle financial transactions database
        CTRL
        sed -i 's/^        //' deb-pkg/${PKG}/DEBIAN/control
        dpkg-deb --build deb-pkg/${PKG} deb-pkg/
    publish:
      package:
        repository_name: 'public'
        package_type: 'deb'
        distro_version: 'ubuntu/noble'
        fail_on_duplicate: false
        artifacts:
          - path: deb-pkg
            patterns: ['*.deb']
