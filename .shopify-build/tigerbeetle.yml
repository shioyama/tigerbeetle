# Shopify CI pipeline for TigerBeetle.

containers:
  default:
    environment: ci
    privileged: true
    build:
      from: ubuntu-24
      type: ci
      apt:
        repos:
          - "deb https://pkgs.shopify.io/STATIC_CLOUDSMITH_TOKEN/public/deb/ubuntu noble main"
        keys:
          - "https://pkgs.shopify.io/STATIC_CLOUDSMITH_TOKEN/public/gpg.key"
        install:
          - git
          - curl
          - xz-utils
          - golang-go

steps:
  - label: ':arrow_down: Download Zig'
    timeout: 5m
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
    run:
      - sh .shopify-build/install-zig.sh

  - label: ':arrow_down: Download fork binaries'
    timeout: 5m
    cache:
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
    run:
      - sh .shopify-build/fetch-fork-binaries.sh

  - wait

  - label: ':test_tube: Unit tests'
    timeout: 10m
    env:
      # `TERM=dumb` makes `zig build` skip the live progress tree (the
      # `tq`/`mq` step lines), which is rendered for any stderr that looks
      # like a TTY — Buildkite's log capture does. `COLOR=1` keeps the
      # custom test runner's pass/fail colors on (it would otherwise also
      # honor `TERM=dumb` via `std.io.tty.detectConfig`).
      TERM: dumb
      COLOR: "1"
    git:
      history: full
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
        upload: false
    run:
      - sh .shopify-build/fetch-upstream-tags.sh
      - ./.zig-install/zig build test:unit test:fmt
  - label: ':camera_with_flash: tb-snapshot tests'
    timeout: 10m
    env:
      TERM: dumb
      COLOR: "1"
    git:
      history: full
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
        upload: false
    run:
      - sh .shopify-build/fetch-upstream-tags.sh
      - ./.zig-install/zig build test:tb-snapshot
  - label: ':zap: Integration tests'
    timeout: 10m
    env:
      SHOPIFY_BUILD_MEMORY_LIMIT: 15g
      TERM: dumb
      COLOR: "1"

    git:
      history: full
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
        upload: false
    run:
      - sh .shopify-build/fetch-upstream-tags.sh
      - ./.zig-install/zig build ci -- integration
  - label: ':bug: Fuzz'
    timeout: 10m
    git:
      history: full
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
        upload: false
    run:
      - sh .shopify-build/fetch-upstream-tags.sh
      - ./.zig-install/zig build fuzz -- smoke
  - label: ':electric_plug: Client tests'
    timeout: 10m
    git:
      history: full
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
        upload: false
    run:
      - sh .shopify-build/fetch-upstream-tags.sh
      - ./.zig-install/zig build vortex:build
      - ./.zig-install/zig build clients:go
      - ./.zig-install/zig build clients:c:sample
  - label: ':package: Validate release build'
    timeout: 30m
    if: build.branch =~ /^release\// || build.branch =~ /^shopify\/upstream-/ || build.env("VALIDATE_RELEASE_BUILD") =~ /^(?i)(1|true|yes)$/
    git:
      history: full
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
      - path: .fork-bins
        digest:
          - .shopify-build/fork-versions.txt
          - .shopify-build/fetch-fork-binaries.sh
        upload: false
    run:
      - sh .shopify-build/fetch-upstream-tags.sh
      # Upstream-merge branches haven't caught the fork changelog up to the new
      # upstream triple yet; bypass fork changelog checks for validation builds.
      - |
        case "$BUILDKITE_BRANCH" in
          shopify/upstream-*) EXTRA=--no-changelog ;;
          *) EXTRA= ;;
        esac
        ./.zig-install/zig build scripts -- release --build --shopify $EXTRA --sha=$BUILDKITE_COMMIT
