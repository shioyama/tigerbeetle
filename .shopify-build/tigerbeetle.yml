# Shopify CI pipeline for TigerBeetle.

containers:
  default:
    environment: ci
    privileged: true
    build:
      from: ubuntu-24
      type: ci
      apt:
        install:
          - git
          - curl
          - xz-utils
          - golang-go

steps:
  - label: ':arrow_down: Download Zig'
    timeout: 5m
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
    run:
      - sh .shopify-build/install-zig.sh

  - wait

  - label: ':test_tube: Tests'
    timeout: 10m
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
    run:
      - git init && git config user.email ci@shopify.com && git config user.name CI && git add -A && git commit -m ci
      - ./.zig-install/zig build -Dgit-commit="$BUILDKITE_COMMIT" test
  - label: ':bug: Fuzz'
    timeout: 10m
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
    run:
      - git init && git config user.email ci@shopify.com && git config user.name CI && git add -A && git commit -m ci
      - ./.zig-install/zig build -Dgit-commit="$BUILDKITE_COMMIT" fuzz -- smoke
  - label: ':electric_plug: Client tests'
    timeout: 10m
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
    run:
      - git init && git config user.email ci@shopify.com && git config user.name CI && git add -A && git commit -m ci
      - ./.zig-install/zig build -Dgit-commit="$BUILDKITE_COMMIT" vortex:build
      - ./.zig-install/zig build -Dgit-commit="$BUILDKITE_COMMIT" clients:go
      - ./.zig-install/zig build -Dgit-commit="$BUILDKITE_COMMIT" clients:c:sample
  - label: ':camera: tb-snapshot'
    timeout: 15m
    only:
      path_changed:
        - tb-snapshot/**
        - src/**
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
    run:
      - cd tb-snapshot && ../.zig-install/zig build test

  - label: ':package: Build and publish release'
    timeout: 30m
    branches: "0.*"
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
    run:
      - ./.zig-install/zig build scripts -- release --build --sha="$BUILDKITE_COMMIT" --timestamp="$(date +%s)"
    publish:
      package:
        repository_name: binaries
        package_type: raw
        artifacts:
          - path: zig-out/dist/tigerbeetle
            patterns: ["tigerbeetle-x86_64-linux.zip"]
          - path: zig-out/dist/go
            patterns: ["*"]
