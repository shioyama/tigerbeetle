# Shopify release pipeline for TigerBeetle.
# Triggered on version tags (e.g. 0.16.77). Builds the TigerBeetle binary
# and Go client, then publishes to Cloudsmith.

containers:
  default:
    environment: ci
    privileged: true
    build:
      from: ubuntu-24
      type: ci
      apt:
        install:
          - curl
          - xz-utils

steps:
  - label: ':arrow_down: Download Zig'
    timeout: 5m
    branches: "0.*"
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
    run:
      - sh .shopify-build/install-zig.sh

  - wait

  - label: ':package: Build and publish release'
    timeout: 30m
    branches: "0.*"
    cache:
      - path: .zig-install
        digest:
          - zig/download.sh
        upload: false
    run:
      - ./.zig-install/zig build scripts -- release --build --sha="$BUILDKITE_COMMIT" --timestamp="$(date +%s)"
    publish:
      package:
        repository_name: binaries
        package_type: raw
        artifacts:
          - path: zig-out/dist/tigerbeetle
            patterns: ["tigerbeetle-x86_64-linux.zip"]
          - path: zig-out/dist/go
            patterns: ["*"]
